let state = {};
let dragging = null;

async function loadState() {
  try {
    const r = await window.storage.get('kanban-v2-state');
    if (r && r.value) state = JSON.parse(r.value);
  } catch(e) {}
  PROSPECTS.forEach(p => {
    if (!state[p.id]) state[p.id] = { stage: 'new', note: '' };
  });
  render();
}

async function saveState() {
  try { await window.storage.set('kanban-v2-state', JSON.stringify(state)); } catch(e) {}
}

function render() {
  STAGES.forEach(s => {
    const body = document.getElementById('body-' + s);
    body.innerHTML = '';
    const cards = PROSPECTS.filter(p => state[p.id].stage === s);
    if (!cards.length) { body.innerHTML = '<div class="empty-col">Drop cards here</div>'; }
    else { cards.forEach(p => body.appendChild(makeCard(p))); }
    document.getElementById('cnt-' + s).textContent = cards.length;
  });
  updateStats();
}

function makeCard(p) {
  const d = document.createElement('div');
  d.className = 'card'; d.draggable = true; d.dataset.id = p.id;
  d.ondragstart = e => { dragging = p.id; e.dataTransfer.effectAllowed = 'move'; d.classList.add('dragging'); };
  d.ondragend = () => { dragging = null; d.classList.remove('dragging'); };
  const sc = p.score>=10?'s10':p.score>=9?'s9':p.score>=8?'s8':'s7';
  const tags = p.tags.map(t=>`<span class="tag tag-${t.c}">${t.t}</span>`).join('');
  const cur = state[p.id].stage, idx = STAGES.indexOf(cur);
  const prev = idx>0?STAGES[idx-1]:null, next = idx<STAGES.length-1?STAGES[idx+1]:null;
  const prevBtn = prev?`<button class="move-btn" onclick="moveCard('${p.id}','${prev}')">← ${STAGE_LABELS[prev]}</button>`:'';
  const nextBtn = next?`<button class="move-btn primary" onclick="moveCard('${p.id}','${next}')">${STAGE_LABELS[next]} →</button>`:'';
  const urlHtml = p.hasUrl ? `<a href="https://${p.url}" target="_blank">${p.url}</a>` : `<span>${p.url}</span>`;
  d.innerHTML = `
    <div class="card-top"><div class="card-name">${p.name}</div><span class="score-pill ${sc}">${p.score}/10</span></div>
    <div class="card-loc">${p.location}</div>
    <div class="card-url">${urlHtml}</div>
    <div class="card-tags">${tags}</div>
    <div class="card-angle">${p.angle}</div>
    <div class="card-note-area">
      <div class="note-label">Notes</div>
      <textarea class="note-input" placeholder="Contact info, dates, follow-ups..." onchange="updateNote('${p.id}',this.value)" onclick="this.parentElement.parentElement.style.cursor='default'" ondblclick="event.stopPropagation()">${state[p.id].note||''}</textarea>
    </div>
    <div class="move-btns">${prevBtn}${nextBtn}</div>`;
  return d;
}

function moveCard(id, stage) { state[id].stage = stage; saveState(); render(); }
function updateNote(id, val) { state[id].note = val; saveState(); }
function ev(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function drop(e, stage) { e.preventDefault(); if (dragging) { state[dragging].stage = stage; saveState(); render(); } }
function updateStats() {
  document.getElementById('active-stat').textContent = PROSPECTS.filter(p=>state[p.id]&&state[p.id].stage==='contacted').length;
  document.getElementById('responded-stat').textContent = PROSPECTS.filter(p=>state[p.id]&&state[p.id].stage==='responded').length;
}
loadState();
</script>
