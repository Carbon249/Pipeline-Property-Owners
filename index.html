
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --col-new: #1a1a2e;
  --col-contacted: #16213e;
  --col-responded: #0f3460;
  --col-closed: #533483;
  --accent: #e94560;
  --accent2: #f5a623;
  --accent3: #2ecc71;
  --accent4: #9b59b6;
  --text: #f0f0f0;
  --text-muted: #8a8a9a;
  --card-bg: #1e1e32;
  --card-border: rgba(255,255,255,0.07);
  --col-header-h: 44px;
  --radius: 10px;
}

body { font-family: 'DM Sans', sans-serif; background: #13131f; color: var(--text); min-height: 100vh; }

.app { padding: 20px 16px 32px; }

.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.header-title { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
.header-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-family: 'DM Mono', monospace; }
.stats { display: flex; gap: 16px; }
.stat { text-align: right; }
.stat-n { font-size: 20px; font-weight: 600; font-family: 'DM Mono', monospace; }
.stat-l { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }

.board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: start; }

.column { background: rgba(255,255,255,0.03); border: 0.5px solid rgba(255,255,255,0.07); border-radius: 14px; overflow: hidden; }

.col-header { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid rgba(255,255,255,0.06); }
.col-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
.col-count { font-size: 11px; font-family: 'DM Mono', monospace; background: rgba(255,255,255,0.1); padding: 2px 7px; border-radius: 20px; color: var(--text-muted); }

.col-new .col-title { color: #64b5f6; }
.col-contacted .col-title { color: var(--accent2); }
.col-responded .col-title { color: var(--accent3); }
.col-closed .col-title { color: var(--accent4); }

.col-body { padding: 10px; min-height: 200px; display: flex; flex-direction: column; gap: 8px; }
.col-body.drag-over { background: rgba(255,255,255,0.04); border-radius: 8px; }

.card {
  background: var(--card-bg);
  border: 0.5px solid var(--card-border);
  border-radius: var(--radius);
  padding: 12px;
  cursor: grab;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  position: relative;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.14); }
.card.dragging { opacity: 0.4; cursor: grabbing; }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card-name { font-size: 13px; font-weight: 500; line-height: 1.3; flex: 1; }
.score-pill { font-size: 10px; font-family: 'DM Mono', monospace; font-weight: 500; padding: 2px 7px; border-radius: 20px; flex-shrink: 0; margin-top: 1px; }
.s10 { background: rgba(46,204,113,0.2); color: #2ecc71; }
.s9  { background: rgba(52,152,219,0.2); color: #52aae8; }
.s8  { background: rgba(245,166,35,0.2); color: #f5a623; }
.s7  { background: rgba(231,76,60,0.2); color: #e74c3c; }

.card-loc { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
.card-url a { font-size: 10.5px; color: #7b9cda; font-family: 'DM Mono', monospace; text-decoration: none; }
.card-url a:hover { color: #a8c4f8; }

.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
.tag-weak { background: rgba(245,166,35,0.12); color: #c9912c; }
.tag-group { background: rgba(46,204,113,0.12); color: #27a85a; }
.tag-owner { background: rgba(155,89,182,0.12); color: #9b59b6; }

.card-angle { font-size: 11px; color: #8a8aaa; line-height: 1.4; margin-top: 6px; font-style: italic; border-top: 0.5px solid rgba(255,255,255,0.05); padding-top: 6px; }

.card-note-area { margin-top: 8px; border-top: 0.5px solid rgba(255,255,255,0.05); padding-top: 8px; }
.note-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
.note-input {
  width: 100%; background: rgba(255,255,255,0.04); border: 0.5px solid rgba(255,255,255,0.08);
  border-radius: 6px; color: var(--text); font-size: 11px; font-family: 'DM Sans', sans-serif;
  padding: 6px 8px; resize: none; outline: none; min-height: 52px; line-height: 1.5;
  transition: border-color 0.15s;
}
.note-input:focus { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.07); }
.note-input::placeholder { color: #555570; }

.move-btns { display: flex; gap: 4px; margin-top: 8px; }
.move-btn {
  font-size: 10px; padding: 3px 8px; border-radius: 5px; border: 0.5px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04); color: var(--text-muted); cursor: pointer;
  font-family: 'DM Sans', sans-serif; transition: background 0.12s, color 0.12s;
}
.move-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.move-btn.primary { background: rgba(233,69,96,0.15); color: var(--accent); border-color: rgba(233,69,96,0.3); }
.move-btn.primary:hover { background: rgba(233,69,96,0.28); }

.empty-col { text-align: center; padding: 24px 12px; color: #44445a; font-size: 12px; }
</style>

<div class="app">
  <div class="header">
    <div>
      <div class="header-title">NC Mountains — Outreach Tracker</div>
      <div class="header-sub">Drag cards across stages or use move buttons</div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-n" id="total-stat">10</div>
        <div class="stat-l">prospects</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="active-stat" style="color:var(--accent2)">0</div>
        <div class="stat-l">in progress</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="responded-stat" style="color:var(--accent3)">0</div>
        <div class="stat-l">responded</div>
      </div>
    </div>
  </div>

  <div class="board" id="board">
    <div class="column col-new" id="col-new" ondragover="ev(event)" ondrop="drop(event,'new')">
      <div class="col-header"><span class="col-title">New</span><span class="col-count" id="cnt-new">0</span></div>
      <div class="col-body" id="body-new"></div>
    </div>
    <div class="column col-contacted" id="col-contacted" ondragover="ev(event)" ondrop="drop(event,'contacted')">
      <div class="col-header"><span class="col-title">Contacted</span><span class="col-count" id="cnt-contacted">0</span></div>
      <div class="col-body" id="body-contacted"></div>
    </div>
    <div class="column col-responded" id="col-responded" ondragover="ev(event)" ondrop="drop(event,'responded')">
      <div class="col-header"><span class="col-title">Responded</span><span class="col-count" id="cnt-responded">0</span></div>
      <div class="col-body" id="body-responded"></div>
    </div>
    <div class="column col-closed" id="col-closed" ondragover="ev(event)" ondrop="drop(event,'closed')">
      <div class="col-header"><span class="col-title">Closed / Pass</span><span class="col-count" id="cnt-closed">0</span></div>
      <div class="col-body" id="body-closed"></div>
    </div>
  </div>
</div>

<script>
const STAGES = ['new','contacted','responded','closed'];
const STAGE_LABELS = {new:'New',contacted:'Contacted',responded:'Responded',closed:'Closed / Pass'};

const PROSPECTS = [
  {
    id:'p1', score:10, name:'Blue Ridge Mountain Lodge',
    owner:'Mike & Jennifer Lin (CA-based)',
    location:'Banner Elk, NC — 9 BR / sleeps 25',
    url:'blueridgemtnlodge.com',
    tags:[{t:'remote owners',c:'owner'},{t:'Leadpages site',c:'weak'},{t:'no inquiry flow',c:'weak'},{t:'family reunion',c:'group'}],
    angle:'Operational relief angle: managing 9BR from California with zero digital infrastructure — pitch guest comms, local partnerships, and inquiry follow-up.'
  },
  {
    id:'p2', score:10, name:'White Fence Farm Rentals',
    owner:'Denise & Fulton Lovin',
    location:'Boone/Trade TN border — 105 acres, barn seats 80–100',
    url:'whitefencefarmrentals.com',
    tags:[{t:'call-only booking',c:'weak'},{t:'no online calendar',c:'weak'},{t:'weddings & retreats',c:'group'},{t:'named owners',c:'owner'}],
    angle:'Missed revenue angle: barn holds 100 people, no booking flow. Direct booking system + event planner outreach could double inquiries.'
  },
  {
    id:'p3', score:9, name:'Heritage Hill Cabins',
    owner:'Small operator, Valle Crucis',
    location:'Valle Crucis, NC — 5-cabin cluster',
    url:'heritagehillcabins.com',
    tags:[{t:'5-cabin cluster',c:'group'},{t:'basic WordPress',c:'weak'},{t:'no group flow',c:'weak'},{t:'farm setting',c:'group'}],
    angle:'Group retreat goldmine angle: 5 private cabins on a farm — perfect for reunions, church groups, yoga retreats. No one knows it exists.'
  },
  {
    id:'p4', score:9, name:'NewlandNest',
    owner:'Owner visible on site',
    location:'Banner Elk / Newland, NC — 7 BR + 4 BR properties',
    url:'newlandnest.com',
    tags:[{t:'anti-platform stated',c:'owner'},{t:'direct booking focus',c:'owner'},{t:'minimal SEO',c:'weak'},{t:'no event angle',c:'weak'}],
    angle:'Direct booking intent angle: already committed to going direct but site has no SEO or booking flow to support it. Help them actually get found.'
  },
  {
    id:'p5', score:8, name:'Deerwood Retreat',
    owner:'Manager: Michael H.',
    location:'Seven Devils, NC — 3 BR / sleeps 10 at 4,700 ft',
    url:'deerwoodretreat.com',
    tags:[{t:'own site exists',c:'owner'},{t:'routes to CCR',c:'weak'},{t:'fairy garden / unique',c:'group'},{t:'still paying fees',c:'weak'}],
    angle:'Fee escape angle: has own website but all bookings route to Carolina Cabin Rentals. Unique property features never marketed. Paying fees they clearly don\'t want to pay.'
  },
  {
    id:'p6', score:8, name:'Buffalo Junction Properties',
    owner:'Sue (sue@lakelurevacationproperties.com)',
    location:'Lake Lure / Rumbling Bald — 14 properties, sleeps 8–16',
    url:'lakelurevacationproperties.com',
    tags:[{t:'reunion / retreat focus',c:'group'},{t:'post-Helene rebuild',c:'weak'},{t:'lake reopening 2026',c:'group'},{t:'small local operator',c:'owner'}],
    angle:'Timing angle: Lake Lure reopens May 2026 — perfect moment to rebuild visibility and get in front of event planners before competitors do.'
  },
  {
    id:'p7', score:8, name:'Beulahland Cabins',
    owner:'Chris Hodges (named on site)',
    location:'Boone, NC — 5 mi from Blue Ridge Pkwy',
    url:'beulahlandcabins.com',
    tags:[{t:'owner named',c:'owner'},{t:'dated website',c:'weak'},{t:'no direct booking calendar',c:'weak'},{t:'personal pride voice',c:'owner'}],
    angle:'Trust + modernization angle: Chris is personally invested but not tech-savvy. Help him modernize without losing what makes the property feel personal.'
  },
  {
    id:'p8', score:8, name:'APPsolute Heaven',
    owner:'Owner visible via listing',
    location:'Banner Elk, NC — 4-season retreat, hot tub',
    url:'Platform only (VRBO/Airbnb)',
    tags:[{t:'no direct website',c:'weak'},{t:'100% platform dependent',c:'weak'},{t:'4-season retreat name',c:'group'},{t:'paying ~15–20% fees',c:'weak'}],
    angle:'Fee savings angle: "4-season retreat" property paying full platform fees with no direct presence — a direct site pays for itself in one booking.'
  },
  {
    id:'p9', score:8, name:'60-Acre Mtn Top Retreat',
    owner:'Owner visible via listing',
    location:'Elk Park, NC (near Banner Elk) — 60 acres',
    url:'Platform only (Travelocity/VRBO)',
    tags:[{t:'60-acre estate',c:'group'},{t:'no direct site',c:'weak'},{t:'no event positioning',c:'weak'},{t:'massive retreat potential',c:'group'}],
    angle:'Untapped market angle: 60 mountain acres with zero retreat/wedding/event positioning. Completely invisible to the audiences that would pay the most.'
  },
  {
    id:'p10', score:7, name:'Abundant Acres Retreat',
    owner:'Owner visible via listing',
    location:'Beech Mountain, NC — sleeps 9, near ski',
    url:'Platform only (Travelocity)',
    tags:[{t:'"retreat" in name',c:'group'},{t:'no direct site',c:'weak'},{t:'no retreat marketing',c:'weak'},{t:'platform-only',c:'weak'}],
    angle:'Brand alignment angle: named a retreat but marketed like a ski cabin. Help retreat organizers find and book it directly.'
  }
];

let state = {};
let dragging = null;

async function loadState() {
  try {
    const r = await window.storage.get('kanban-state');
    if (r && r.value) state = JSON.parse(r.value);
  } catch(e) {}
  PROSPECTS.forEach(p => {
    if (!state[p.id]) state[p.id] = { stage: 'new', note: '' };
  });
  render();
}

async function saveState() {
  try { await window.storage.set('kanban-state', JSON.stringify(state)); } catch(e) {}
}

function render() {
  STAGES.forEach(s => {
    const body = document.getElementById('body-' + s);
    body.innerHTML = '';
    const cards = PROSPECTS.filter(p => state[p.id].stage === s);
    if (cards.length === 0) {
      body.innerHTML = '<div class="empty-col">Drop cards here</div>';
    } else {
      cards.forEach(p => body.appendChild(makeCard(p)));
    }
    document.getElementById('cnt-' + s).textContent = cards.length;
  });
  updateStats();
}

function makeCard(p) {
  const d = document.createElement('div');
  d.className = 'card';
  d.draggable = true;
  d.dataset.id = p.id;
  d.ondragstart = e => { dragging = p.id; e.dataTransfer.effectAllowed = 'move'; d.classList.add('dragging'); };
  d.ondragend = () => { dragging = null; d.classList.remove('dragging'); };

  const sc = p.score >= 10 ? 's10' : p.score >= 9 ? 's9' : p.score >= 8 ? 's8' : 's7';
  const tags = p.tags.map(t => `<span class="tag tag-${t.c}">${t.t}</span>`).join('');

  const curStage = state[p.id].stage;
  const stageIdx = STAGES.indexOf(curStage);
  const prevStage = stageIdx > 0 ? STAGES[stageIdx-1] : null;
  const nextStage = stageIdx < STAGES.length-1 ? STAGES[stageIdx+1] : null;

  const prevBtn = prevStage ? `<button class="move-btn" onclick="moveCard('${p.id}','${prevStage}')">← ${STAGE_LABELS[prevStage]}</button>` : '';
  const nextBtn = nextStage ? `<button class="move-btn primary" onclick="moveCard('${p.id}','${nextStage}')">${STAGE_LABELS[nextStage]} →</button>` : '';

  const urlDisplay = p.url.startsWith('Platform') ? `<span style="font-size:10.5px;color:#555570;font-family:'DM Mono',monospace;">${p.url}</span>` : `<a href="https://${p.url}" target="_blank">${p.url}</a>`;

  d.innerHTML = `
    <div class="card-top">
      <div class="card-name">${p.name}</div>
      <span class="score-pill ${sc}">${p.score}/10</span>
    </div>
    <div class="card-loc">${p.location}</div>
    <div class="card-url">${urlDisplay}</div>
    <div class="card-tags">${tags}</div>
    <div class="card-angle">${p.angle}</div>
    <div class="card-note-area">
      <div class="note-label">Your notes</div>
      <textarea class="note-input" placeholder="Add notes, contact info, follow-up dates..." onchange="updateNote('${p.id}',this.value)" onclick="this.parentElement.parentElement.style.cursor='default'" ondblclick="event.stopPropagation()">${state[p.id].note || ''}</textarea>
    </div>
    <div class="move-btns">${prevBtn}${nextBtn}</div>
  `;
  return d;
}

function moveCard(id, stage) {
  state[id].stage = stage;
  saveState();
  render();
}

function updateNote(id, val) {
  state[id].note = val;
  saveState();
}

function ev(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }

function drop(e, stage) {
  e.preventDefault();
  if (dragging) {
    state[dragging].stage = stage;
    saveState();
    render();
  }
}

function updateStats() {
  const active = PROSPECTS.filter(p => state[p.id] && (state[p.id].stage === 'contacted')).length;
  const responded = PROSPECTS.filter(p => state[p.id] && state[p.id].stage === 'responded').length;
  document.getElementById('active-stat').textContent = active;
  document.getElementById('responded-stat').textContent = responded;
}

loadState();
</script>
